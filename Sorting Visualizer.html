<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sorting Visualizer</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1d1d1b;--mut:#6b6a63;--bd:#dcdad2;--bar:#6c8ebf;--cmp:#e8a317;--swp:#d64545;--srt:#3f9d6b;--piv:#8e5bc4;--ac:#1d1d1b;--acx:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161615;--card:#222220;--tx:#f0efe9;--mut:#a09f96;--bd:#3a3a36;--bar:#7fa3d6;--cmp:#f0b83a;--swp:#ef6a6a;--srt:#52bd86;--piv:#b088e0;--ac:#f0efe9;--acx:#161615;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#161615;--card:#222220;--tx:#f0efe9;--mut:#a09f96;--bd:#3a3a36;--bar:#7fa3d6;--cmp:#f0b83a;--swp:#ef6a6a;--srt:#52bd86;--piv:#b088e0;--ac:#f0efe9;--acx:#161615;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:900px;margin:0 auto;padding:16px}
h1{font-size:1.3rem;margin:0 0 2px}
.sub{color:var(--mut);margin:0 0 14px;font-size:.9rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px}
canvas{width:100%;height:280px;display:block}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px}
label{font-size:.8rem;color:var(--mut);display:flex;flex-direction:column;gap:4px;flex:1 1 140px}
select,button,input[type=range]{font:inherit}
select{padding:8px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
button{padding:9px 14px;border-radius:9px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer;flex:1 1 auto}
button.p{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:600}
button:disabled{opacity:.4}
input[type=range]{width:100%;accent-color:var(--ac)}
.stats{display:flex;gap:16px;flex-wrap:wrap;font-size:.85rem;margin-top:10px}
.stats b{font-variant-numeric:tabular-nums}
.msg{margin-top:8px;min-height:1.4em;font-size:.9rem}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.78rem;color:var(--mut);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px}
.info{margin-top:12px;font-size:.85rem;color:var(--mut)}
</style>
</head>
<body>
<main>
<h1>Sorting Visualizer</h1>
<p class="sub">Play, pause, step forward or back, or scrub through every comparison and swap.</p>
<div class="card">
<canvas id="cv"></canvas>
<div class="legend"><span><i style="background:var(--bar)"></i>Unsorted</span><span><i style="background:var(--cmp)"></i>Comparing</span><span><i style="background:var(--swp)"></i>Swap / write</span><span><i style="background:var(--piv)"></i>Pivot</span><span><i style="background:var(--srt)"></i>Sorted</span></div>
<div class="msg" id="msg"></div>
<div class="stats"><span>Step <b id="st">0</b>/<b id="tot">0</b></span><span>Comparisons <b id="cc">0</b></span><span>Swaps/writes <b id="sc">0</b></span></div>
<div class="row"><label>Timeline<input type="range" id="scrub" min="0" max="0" value="0"></label></div>
<div class="row">
<button id="back">⏮ Back</button><button id="play" class="p">▶ Play</button><button id="fwd">Step ⏭</button><button id="reset">Restart</button>
</div>
<div class="row">
<label>Algorithm<select id="alg"><option value="bubble">Bubble sort</option><option value="selection">Selection sort</option><option value="insertion">Insertion sort</option><option value="merge">Merge sort</option><option value="quick">Quick sort</option><option value="heap">Heap sort</option></select></label>
<label>Array size: <span id="nv">30</span><input type="range" id="size" min="5" max="100" value="30"></label>
<label>Speed<input type="range" id="speed" min="1" max="100" value="50"></label>
<button id="gen">New array</button>
</div>
<div class="info" id="info"></div>
</div>
</main>
<script>
const INFO={
bubble:"Bubble sort: repeatedly swaps adjacent out-of-order pairs. Time O(n²), space O(1), stable.",
selection:"Selection sort: picks the minimum of the unsorted part and moves it forward. Time O(n²), space O(1), not stable.",
insertion:"Insertion sort: grows a sorted prefix by inserting each new item. Time O(n²), best case O(n), stable.",
merge:"Merge sort: splits, sorts halves, merges them. Time O(n log n), space O(n), stable.",
quick:"Quick sort (Lomuto): partitions around a pivot, then recurses. Average O(n log n), worst O(n²).",
heap:"Heap sort: builds a max-heap, then repeatedly moves the root to the end. Time O(n log n), space O(1)."};

function record(name,input){
  const a=input.slice(),n=a.length,sorted=new Array(n).fill(false),steps=[];
  let c=0,w=0;
  const push=(cmp,swp,piv,msg)=>steps.push({a:a.slice(),cmp,swp,piv,s:sorted.slice(),c,w,msg});
  const C=(i,j,piv)=>{c++;push([i,j],[],piv??-1,`Compare ${a[i]} and ${a[j]}`)};
  const S=(i,j,piv)=>{[a[i],a[j]]=[a[j],a[i]];w++;push([],[i,j],piv??-1,`Swap positions ${i} and ${j}`)};
  push([],[],-1,"Initial array");
  if(name==="bubble"){
    for(let i=0;i<n-1;i++){for(let j=0;j<n-i-1;j++){C(j,j+1);if(a[j]>a[j+1])S(j,j+1)}sorted[n-i-1]=true}
  }else if(name==="selection"){
    for(let i=0;i<n-1;i++){let m=i;for(let j=i+1;j<n;j++){C(j,m);if(a[j]<a[m])m=j}if(m!==i)S(i,m);sorted[i]=true}
  }else if(name==="insertion"){
    for(let i=1;i<n;i++){let j=i;while(j>0){C(j-1,j);if(a[j-1]>a[j]){S(j-1,j);j--}else break}}
  }else if(name==="merge"){
    const ms=(l,r)=>{if(l>=r)return;const m=(l+r)>>1;ms(l,m);ms(m+1,r);
      const L=a.slice(l,m+1),R=a.slice(m+1,r+1);let i=0,j=0,k=l;
      while(i<L.length&&j<R.length){c++;push([l+i,m+1+j],[],-1,`Compare ${L[i]} and ${R[j]}`);
        a[k]=L[i]<=R[j]?L[i++]:R[j++];w++;push([],[k],-1,`Write ${a[k]} to position ${k}`);k++}
      while(i<L.length){a[k]=L[i++];w++;push([],[k],-1,`Write ${a[k]} to position ${k}`);k++}
      while(j<R.length){a[k]=R[j++];w++;push([],[k],-1,`Write ${a[k]} to position ${k}`);k++}
      if(l===0&&r===n-1)sorted.fill(true)};
    ms(0,n-1);
  }else if(name==="quick"){
    const qs=(l,r)=>{if(l>r)return;if(l===r){sorted[l]=true;return}
      let i=l;for(let j=l;j<r;j++){C(j,r,r);if(a[j]<a[r]){if(i!==j)S(i,j,r);i++}}
      if(i!==r)S(i,r,i);sorted[i]=true;qs(l,i-1);qs(i+1,r)};
    qs(0,n-1);
  }else if(name==="heap"){
    const hp=(sz,i)=>{for(;;){let l=2*i+1,r=l+1,m=i;
      if(l<sz){C(l,m);if(a[l]>a[m])m=l}
      if(r<sz){C(r,m);if(a[r]>a[m])m=r}
      if(m===i)return;S(i,m);i=m}};
    for(let i=(n>>1)-1;i>=0;i--)hp(n,i);
    for(let e=n-1;e>0;e--){S(0,e);sorted[e]=true;hp(e,0)}
  }
  sorted.fill(true);push([],[],-1,"Sorted!");
  return steps;
}

const $=id=>document.getElementById(id),cv=$("cv"),ctx=cv.getContext("2d");
let data=[],steps=[],pos=0,timer=null;

function col(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim()}
function draw(){
  const dpr=window.devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;
  if(cv.width!==Math.round(w*dpr)||cv.height!==Math.round(h*dpr)){cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr)}
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);
  const s=steps[pos],n=s.a.length,bw=w/n,max=Math.max(...data),gap=n>60?0.5:n>30?1:2;
  const C={bar:col("--bar"),cmp:col("--cmp"),swp:col("--swp"),srt:col("--srt"),piv:col("--piv")};
  for(let i=0;i<n;i++){
    let f=C.bar;
    if(s.s[i])f=C.srt;
    if(s.piv===i)f=C.piv;
    if(s.cmp.includes(i))f=C.cmp;
    if(s.swp.includes(i))f=C.swp;
    const bh=(s.a[i]/max)*(h-18);
    ctx.fillStyle=f;ctx.fillRect(i*bw+gap/2,h-bh,Math.max(bw-gap,1),bh);
    if(bw>22){ctx.fillStyle=col("--tx");ctx.font="11px system-ui";ctx.textAlign="center";ctx.fillText(s.a[i],i*bw+bw/2,h-bh-3)}
  }
  $("st").textContent=pos;$("tot").textContent=steps.length-1;
  $("cc").textContent=s.c;$("sc").textContent=s.w;$("msg").textContent=s.msg;
  $("scrub").value=pos;
  $("back").disabled=pos===0;$("fwd").disabled=pos>=steps.length-1;
}
function stop(){clearInterval(timer);timer=null;$("play").textContent="▶ Play"}
function play(){
  if(timer){stop();return}
  if(pos>=steps.length-1)pos=0;
  $("play").textContent="⏸ Pause";
  const d=1000/Math.pow(1.07,+$("speed").value)+2;
  timer=setInterval(()=>{if(pos<steps.length-1){pos++;draw()}else stop()},d);
}
function build(){
  stop();steps=record($("alg").value,data);pos=0;
  $("scrub").max=steps.length-1;$("info").textContent=INFO[$("alg").value];draw();
}
function gen(){
  const n=+$("size").value;$("nv").textContent=n;
  data=Array.from({length:n},()=>Math.floor(Math.random()*95)+5);build();
}
$("gen").onclick=gen;
$("size").oninput=gen;
$("alg").onchange=build;
$("reset").onclick=()=>{stop();pos=0;draw()};
$("play").onclick=play;
$("fwd").onclick=()=>{stop();if(pos<steps.length-1){pos++;draw()}};
$("back").onclick=()=>{stop();if(pos>0){pos--;draw()}};
$("scrub").oninput=e=>{stop();pos=+e.target.value;draw()};
$("speed").oninput=()=>{if(timer){stop();play()}};
addEventListener("resize",draw);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
gen();
</script>
</body>
</html>
